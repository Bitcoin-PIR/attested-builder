[package]
name = "pir-attested-builder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Attested BitcoinPIR database builder"

[[bin]]
name = "pir-attested-builder"
path = "src/main.rs"

[dependencies]
dbpipeline = { path = "../dbpipeline" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
getrandom = "=0.2.17"
hex = "=0.4.3"
libc = "=0.2.183"
rootbundle = { path = "../rootbundle" }
sha2 = { version = "=0.10.9", default-features = false }
utxosnapshot = { path = "../utxosnapshot" }
