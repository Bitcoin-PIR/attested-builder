# Standalone workspace. Current scope is README.md; PLAN.md is a frozen
# 2026-06 design note. This repository is already Bitcoin-PIR/attested-builder.

[workspace]
resolver = "2"
members = [
    "builder",
    "coremuhash",
    "dbpipeline",
    "onionffi",
    "rootbundle",
    "utxosnapshot",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
codegen-units = 1
incremental = false
