[package]
name = "rootbundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical root-bundle payload: binds PIR Merkle roots to a chain anchor + muhash (optional Ed25519 wrapper)"
publish = false

[dependencies]
# Same version/feature shape as pir-identity, resolves against ../../vendor.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
hex = "=0.4.3"
